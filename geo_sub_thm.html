<script>
const state = {
    pappus: {
        canvas: document.getElementById('canvasPappus'),
        points: [],
        baseWidth: 600,
        baseHeight: 400
    },
    ptolemy: {
        canvas: document.getElementById('canvasPtolemy'),
        points: [],
        baseWidth: 600,
        baseHeight: 450
    }
};

let dragging = { section: null, point: null };

function resizeCanvas(section) {
    const s = state[section];
    const canvas = s.canvas;
    const wrap = canvas.parentElement;

    const wrapWidth = wrap.clientWidth;
    const isMobile = window.innerWidth < 768;

    const displayWidth = Math.min(
        isMobile ? 420 : 600,
        Math.max(280, wrapWidth)
    );

    const aspect = s.baseHeight / s.baseWidth;
    const displayHeight = displayWidth * aspect;

    canvas.style.width = displayWidth + "px";
    canvas.style.height = displayHeight + "px";

    const dpr = window.devicePixelRatio || 1;
    canvas.width = displayWidth * dpr;
    canvas.height = displayHeight * dpr;

    const ctx = canvas.getContext("2d");
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);

    s.ctx = ctx;
}

function debounce(fn, delay){
    let t;
    return (...args)=>{
        clearTimeout(t);
        t = setTimeout(() => fn(...args), delay);
    };
}

function init() {
    resetPoints('pappus');
    resetPoints('ptolemy');

    resizeCanvas('pappus');
    resizeCanvas('ptolemy');

    [state.pappus, state.ptolemy].forEach(s => {
        const id = s === state.pappus ? 'pappus' : 'ptolemy';

        s.canvas.addEventListener('mousedown', (e) => handleStart(e, id));
        s.canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleStart(e.touches[0], id);
        }, { passive: false });
    });

    window.addEventListener('resize', debounce(() => {
        resizeCanvas('pappus');
        resizeCanvas('ptolemy');
    }, 100));

    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);

    window.addEventListener('touchmove', (e) => {
        if (e.touches.length > 0) {
            handleMove(e.touches[0]);
        }
    }, { passive: false });

    window.addEventListener('touchend', handleEnd);

    requestAnimationFrame(renderLoop);
}

function resetPoints(section) {
    if (section === 'pappus') {
        state.pappus.points = [
            { x: 300, y: 80 },
            { x: 150, y: 320 },
            { x: 450, y: 320 }
        ];
    } else {
        const cx = 300, cy = 225, r = 160;
        state.ptolemy.points = [
            { x: cx + r * Math.cos(-2.0), y: cy + r * Math.sin(-2.0) },
            { x: cx + r * Math.cos(-0.6), y: cy + r * Math.sin(-0.6) },
            { x: cx + r * Math.cos(0.9), y: cy + r * Math.sin(0.9) },
            { x: cx + r * Math.cos(2.8), y: cy + r * Math.sin(2.8) }
        ];
    }
}

function handleStart(e, section){
    const s = state[section];
    const rect = s.canvas.getBoundingClientRect();

    const x = (e.clientX - rect.left) * (s.baseWidth / rect.width);
    const y = (e.clientY - rect.top) * (s.baseHeight / rect.height);

    s.points.forEach(p => {
        if (Math.hypot(x - p.x, y - p.y) < 30) {
            dragging = { section, point: p };
        }
    });
}

function handleMove(e){
    if (!dragging.point) return;

    const s = state[dragging.section];
    const rect = s.canvas.getBoundingClientRect();

    const x = (e.clientX - rect.left) * (s.baseWidth / rect.width);
    const y = (e.clientY - rect.top) * (s.baseHeight / rect.height);

    dragging.point.x = x;
    dragging.point.y = y;
}

function handleEnd(){
    dragging = { section: null, point: null };
}

function renderLoop(){
    renderPappus();
    renderPtolemy();
    requestAnimationFrame(renderLoop);
}

function renderPappus(){
    const s = state.pappus;
    const ctx = s.ctx;
    if (!ctx) return;

    ctx.clearRect(0, 0, s.baseWidth, s.baseHeight);

    const [A, B, C] = s.points;
    const M = { x: (B.x + C.x) / 2, y: (B.y + C.y) / 2 };

    ctx.beginPath();
    ctx.moveTo(B.x, B.y);
    ctx.lineTo(A.x, A.y);
    ctx.lineTo(C.x, C.y);
    ctx.strokeStyle = "#2563eb";
    ctx.lineWidth = 5;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(A.x, A.y);
    ctx.lineTo(M.x, M.y);
    ctx.strokeStyle = "#059669";
    ctx.setLineDash([10, 5]);
    ctx.stroke();
    ctx.setLineDash([]);

    drawNodes(ctx, [A, B, C]);
}

function renderPtolemy(){
    const s = state.ptolemy;
    const ctx = s.ctx;
    if (!ctx) return;

    ctx.clearRect(0, 0, s.baseWidth, s.baseHeight);

    const [A, B, C, D] = s.points;

    ctx.beginPath();
    ctx.moveTo(A.x, A.y);
    ctx.lineTo(B.x, B.y);
    ctx.lineTo(C.x, C.y);
    ctx.lineTo(D.x, D.y);
    ctx.closePath();
    ctx.strokeStyle = "#6366f1";
    ctx.lineWidth = 5;
    ctx.stroke();

    drawNodes(ctx, [A, B, C, D]);
}

function drawNodes(ctx, points){
    points.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 10, 0, Math.PI * 2);
        ctx.fillStyle = "#111";
        ctx.fill();
    });
}

window.addEventListener("load", init);
</script>
