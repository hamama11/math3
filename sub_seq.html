<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수학적 귀납법 시각화 (PC 최적화)</title>
  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 폰트 및 애니메이션 커스텀 설정 */
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; }
    
    .domino {
      transform-origin: bottom right;
    }
    
    @keyframes fall {
      0% { transform: rotate(0deg) translateX(0); opacity: 1; }
      100% { transform: rotate(65deg) translateX(1.5rem); opacity: 0.95; }
    }
    
    .falling {
      animation: fall 0.3s ease-in both;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-100 to-gray-300 min-h-screen flex items-center justify-center p-4 text-gray-800">

  <!-- React를 대체할 루트 컨테이너 (PC에 맞게 넓이 최대화) -->
  <div id="app-root" class="w-full max-w-[1400px] bg-white rounded-3xl shadow-2xl overflow-hidden flex flex-col h-[94vh]"></div>

  <script>
    // --- 상태 관리 ---
    let step = 0;

    const explanations = [
      { title: "도입: 항의 개수 비교", desc: "일반 귀납법과 강한 귀납법에서 다음 항을 증명하기 위해 몇 개의 이전 항이 필요한지 비교합니다." },
      { title: "Step 1: 기본 단계 (시작점)", desc: "일반 귀납법은 1개의 시작점(n=1)만 필요하지만, 강한 귀납법은 2개의 시작점(n=1, n=2)이 참임을 증명해야 합니다." },
      { title: "Step 2: 귀납 가정", desc: "일반 귀납법은 바로 앞 1개(n=k)만 참이라 가정하지만, 강한 귀납법은 최소 앞 2개(n=k-1, n=k)를 참이라 가정합니다." },
      { title: "Step 3: 귀납 단계 (증명)", desc: "일반 귀납법은 1개로 다음 1개를 증명하지만, 강한 귀납법은 2개를 '합쳐서' 다음 1개를 증명합니다." },
      { title: "Step 4: 도미노 비유 (시각화)", desc: "일반 귀납법은 도미노가 1:1로 쓰러집니다. 강한 귀납법은 2개의 도미노가 앞뒤로 겹쳐서 다음 2개를 미는 연쇄 작용을 합니다." }
    ];

    // --- 액션 함수 ---
    function nextStep() { if (step < 4) { step++; render(); } }
    function prevStep() { if (step > 0) { step--; render(); } }
    function resetStep() { step = 0; render(); }

    // --- 컴포넌트 (도미노 & 아이콘) - 크기 확대 ---
    function StandardDomino(delay, isFalling, colorClass = "from-blue-400 to-blue-600 border-blue-700") {
      return `
        <div class="relative w-8 h-20 bg-gradient-to-b ${colorClass} rounded-md shadow-lg border domino ${isFalling ? 'falling' : 'opacity-100'}" style="${isFalling ? `animation-delay: ${delay}ms;` : ''}">
          <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-5 border-t-[2px] border-white/60"></div>
          <div class="absolute top-3 left-1/2 -translate-x-1/2 w-2 h-2 bg-white/90 rounded-full shadow-inner"></div>
          <div class="absolute bottom-3 left-1/2 -translate-x-1/2 w-2 h-2 bg-white/90 rounded-full shadow-inner"></div>
        </div>`;
    }

    // 앞뒤 밀착형 도미노 (크기 확대)
    function FrontBackDomino(delay, isFalling, isTarget = false) {
      const colorBack = isTarget ? "from-indigo-800 to-indigo-950 border-indigo-950" : "from-indigo-600 to-indigo-800 border-indigo-900";
      const colorFront = isTarget ? "from-indigo-600 to-indigo-800 border-indigo-900" : "from-indigo-400 to-indigo-500 border-indigo-600";
      
      return `
        <div class="relative w-12 h-20 domino ${isFalling ? 'falling' : 'opacity-100'} mx-3" style="${isFalling ? `animation-delay: ${delay}ms;` : ''}">
          <!-- 밀어주는 뒤쪽 도미노 -->
          <div class="absolute bottom-0 left-0 w-8 h-20 bg-gradient-to-b ${colorBack} rounded-md shadow-md border z-0">
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-4 border-t-[2px] border-white/30"></div>
            <div class="absolute top-3 left-1/2 -translate-x-1/2 w-2 h-2 bg-white/40 rounded-full"></div>
            <div class="absolute bottom-3 left-1/2 -translate-x-1/2 w-2 h-2 bg-white/40 rounded-full"></div>
          </div>
          <!-- 밀림을 받는 앞쪽 도미노 -->
          <div class="absolute bottom-0 left-4 w-8 h-20 bg-gradient-to-b ${colorFront} rounded-md shadow-xl border z-10">
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-5 border-t-[2px] border-white/70"></div>
            <div class="absolute top-3 left-1/2 -translate-x-1/2 w-2 h-2 bg-white/90 rounded-full shadow-inner"></div>
            <div class="absolute bottom-3 left-1/2 -translate-x-1/2 w-2 h-2 bg-white/90 rounded-full shadow-inner"></div>
          </div>
        </div>`;
    }

    function ArrowSVG(isActive, isBounce) {
      return `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="transition-all duration-300 ${isActive ? 'text-slate-400' : 'text-slate-200'} ${isBounce ? 'animate-bounce text-emerald-500' : ''}"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>`;
    }

    // --- 렌더링 함수 ---
    function render() {
      const root = document.getElementById('app-root');
      
      root.innerHTML = `
        <!-- Header -->
        <div class="bg-slate-800 text-white py-3 px-8 flex justify-between items-center shrink-0">
          <h1 class="text-2xl font-extrabold tracking-widest">수학적 귀납법 비교 시각화</h1>
        </div>

        <!-- Controls & Explanation -->
        <div class="px-8 py-5 bg-blue-50/80 border-b border-blue-200 flex flex-row items-center justify-between gap-6 shrink-0">
          <div class="flex-1 text-left">
            <h2 class="text-2xl font-extrabold text-blue-900 mb-2 flex items-center justify-start gap-3">
              <span class="bg-blue-600 text-white w-8 h-8 rounded-full flex items-center justify-center text-lg shadow-md">${step}</span>
              ${explanations[step].title}
            </h2>
            <p class="text-blue-800 text-lg font-medium leading-relaxed">
              ${explanations[step].desc}
            </p>
          </div>
          <div class="flex gap-2.5 bg-white p-2 rounded-2xl shadow-sm border border-blue-100 shrink-0">
            <button onclick="prevStep()" ${step === 0 ? 'disabled' : ''} class="p-3 text-gray-600 hover:bg-gray-100 hover:text-blue-600 rounded-xl disabled:opacity-30 transition-all">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <button onclick="resetStep()" class="p-3 text-gray-600 hover:bg-gray-100 hover:text-blue-600 rounded-xl transition-all" title="초기화">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            </button>
            <button onclick="nextStep()" ${step === 4 ? 'disabled' : ''} class="px-6 py-3 bg-blue-600 text-white text-lg font-bold rounded-xl hover:bg-blue-700 disabled:opacity-30 transition-all flex items-center gap-2 shadow-lg">
              다음 단계 <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
            </button>
          </div>
        </div>

        <!-- Visualization Canvas -->
        <div class="p-4 md:p-6 grid grid-cols-1 md:grid-cols-2 gap-6 overflow-hidden flex-1 bg-gray-100/50">
          
          <!-- Left: Standard Induction -->
          <div class="flex flex-col items-center bg-white border-2 border-slate-200 rounded-3xl p-6 shadow-md relative h-full justify-between">
            <div class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-slate-700 text-white text-lg font-bold px-8 py-2 rounded-full shadow-lg whitespace-nowrap">
              일반 수학적 귀납법
            </div>
            
            <!-- 가장 큰 증명 목표 박스 -->
            <div class="flex flex-col items-center bg-slate-50 px-6 py-4 rounded-2xl shadow-inner border border-slate-200 w-full text-center shrink-0 mb-4 mt-6">
              <div class="text-[36px] text-rose-500 font-black tracking-tight mb-1">🎯 목표: a<sub>n</sub> = 2<sup>n</sup></div>
              <div class="text-[22px] font-extrabold tracking-tight text-slate-700 mt-2">조건: <span class="text-blue-700">a<sub>k+1</sub> = 2a<sub>k</sub></span> <span class="text-[16px] text-slate-500 font-bold ml-1">(등비수열)</span></div>
            </div>
            
            <div class="flex flex-col items-center w-full flex-1 justify-center space-y-3 my-2">
              
              <!-- Base Step -->
              <div class="flex flex-col items-center transition-all duration-500 w-full max-w-[320px] ${step >= 1 ? 'opacity-100' : 'opacity-20 blur-[2px]'}">
                <div class="w-full p-4 rounded-2xl border-4 text-center transition-all duration-300 ${step === 1 ? 'bg-emerald-50 border-emerald-500 shadow-xl scale-105' : 'bg-white border-slate-200'}">
                  <div class="font-extrabold text-[28px] ${step === 1 ? 'text-emerald-700' : 'text-slate-700'} leading-none mb-2">n = 1</div>
                  ${step >= 1 ? `<div class="text-[20px] font-bold text-slate-700 bg-white/80 rounded-lg px-2 py-1">a<sub>1</sub> = 2<sup>1</sup> = 2</div>` : ''}
                </div>
              </div>

              ${ArrowSVG(step >= 1, step === 1)}

              <!-- Inductive Hypothesis -->
              <div class="flex flex-col items-center transition-all duration-500 w-full max-w-[320px] ${step >= 2 ? 'opacity-100' : 'opacity-20 blur-[2px]'}">
                <div class="w-full p-4 rounded-2xl border-4 text-center transition-all duration-300 ${step === 2 ? 'bg-amber-50 border-amber-500 shadow-xl scale-105' : 'bg-white border-slate-200'}">
                  <div class="font-extrabold text-[28px] ${step === 2 ? 'text-amber-700' : 'text-slate-700'} leading-none mb-2">n = k</div>
                  ${step >= 2 ? `<div class="text-[20px] font-bold text-slate-700 bg-white/80 rounded-lg px-2 py-1">a<sub>k</sub> = 2<sup>k</sup> 가정</div>` : ''}
                </div>
              </div>

              ${ArrowSVG(step >= 2, step === 2)}

              <!-- Inductive Step (Target) -->
              <div class="flex flex-col items-center transition-all duration-500 w-full max-w-[360px] ${step >= 3 ? 'opacity-100' : 'opacity-20 blur-[2px]'}">
                <div class="w-full p-4 rounded-2xl border-4 text-center transition-all duration-300 ${step === 3 ? 'bg-blue-50 border-blue-600 shadow-2xl scale-110' : 'bg-white border-slate-200'}">
                  <div class="font-extrabold text-[28px] ${step === 3 ? 'text-blue-800' : 'text-slate-700'} leading-none mb-2">n = k + 1</div>
                  ${step >= 3 ? `
                    <div class="text-[20px] font-bold text-slate-800 bg-white/80 rounded-lg px-2 py-1.5 leading-snug">
                      2(a<sub>k</sub>) = 2(2<sup>k</sup>) = 2<sup>k+1</sup>
                    </div>
                  ` : ''}
                </div>
              </div>
            </div>
            
            <!-- 도미노 효과 -->
            <div class="w-full flex flex-col items-center bg-blue-50 rounded-2xl px-4 border-2 border-blue-200 transition-all duration-500 overflow-hidden ${step === 4 ? 'py-4 max-h-[160px] opacity-100 mt-4' : 'py-0 max-h-0 opacity-0 border-transparent mt-0'} shrink-0">
              <div class="text-[16px] font-black text-blue-900 mb-3">1대1 연쇄 작용</div>
              <div class="flex gap-4 items-end h-[80px] mr-10">
                ${StandardDomino(100, step === 4)}
                ${StandardDomino(300, step === 4)}
                ${StandardDomino(500, step === 4)}
                ${StandardDomino(700, step === 4, "from-blue-600 to-blue-800 border-blue-900")}
              </div>
            </div>
          </div>

          <!-- Right: Strong Induction -->
          <div class="flex flex-col items-center bg-indigo-50/40 border-2 border-indigo-200 rounded-3xl p-6 shadow-md relative h-full justify-between">
            <div class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-indigo-700 text-white text-lg font-bold px-8 py-2 rounded-full shadow-lg whitespace-nowrap">
              강한 수학적 귀납법
            </div>

            <!-- 가장 큰 증명 목표 박스 -->
            <div class="flex flex-col items-center bg-indigo-100/70 px-6 py-4 rounded-2xl shadow-inner border border-indigo-300 w-full text-center shrink-0 mb-4 mt-6">
              <div class="text-[36px] text-rose-500 font-black tracking-tight mb-1">🎯 목표: a<sub>n</sub> = 2<sup>n</sup></div>
              <div class="text-[22px] font-extrabold tracking-tight text-slate-800 mt-2">조건: <span class="text-indigo-900">a<sub>k+1</sub> = 3a<sub>k</sub> - 2a<sub>k-1</sub></span></div>
            </div>
            
            <div class="flex flex-col items-center w-full flex-1 justify-center space-y-3 my-2">
              
              <!-- Base Step -->
              <div class="flex flex-col items-center w-full transition-all duration-500 ${step >= 1 ? 'opacity-100' : 'opacity-20 blur-[2px]'}">
                <div class="flex items-center justify-center gap-3 w-full px-2">
                  <div class="p-4 rounded-2xl border-4 text-center flex-1 transition-all duration-300 ${step === 1 ? 'bg-emerald-50 border-emerald-500 shadow-xl scale-105' : 'bg-white border-indigo-200'}">
                    <div class="font-extrabold text-[28px] ${step === 1 ? 'text-emerald-700' : 'text-slate-700'} leading-none mb-2">n = 1</div>
                    ${step >= 1 ? `<div class="text-[18px] font-bold text-slate-700 bg-white/80 rounded-lg px-1 py-0.5">a<sub>1</sub> = 2</div>` : ''}
                  </div>
                  <span class="text-indigo-400 font-black text-4xl">+</span>
                  <div class="p-4 rounded-2xl border-4 text-center flex-1 transition-all duration-300 ${step === 1 ? 'bg-emerald-50 border-emerald-500 shadow-xl scale-105' : 'bg-white border-indigo-200'}">
                    <div class="font-extrabold text-[28px] ${step === 1 ? 'text-emerald-700' : 'text-slate-700'} leading-none mb-2">n = 2</div>
                    ${step >= 1 ? `<div class="text-[18px] font-bold text-slate-700 bg-white/80 rounded-lg px-1 py-0.5">a<sub>2</sub> = 4</div>` : ''}
                  </div>
                </div>
              </div>

              <div class="flex justify-center w-full gap-28 relative h-8">
                <div class="absolute left-1/4 -translate-x-1/2">${ArrowSVG(step >= 1, step === 1)}</div>
                <div class="absolute right-1/4 translate-x-1/2">${ArrowSVG(step >= 1, step === 1)}</div>
              </div>

              <!-- Inductive Hypothesis -->
              <div class="flex flex-col items-center w-full transition-all duration-500 ${step >= 2 ? 'opacity-100' : 'opacity-20 blur-[2px]'}">
                <div class="flex items-center justify-center gap-3 w-full px-2">
                  <div class="p-4 rounded-2xl border-4 text-center flex-1 transition-all duration-300 ${step === 2 ? 'bg-amber-50 border-amber-500 shadow-xl scale-105' : 'bg-white border-indigo-200'}">
                    <div class="font-extrabold text-[28px] ${step === 2 ? 'text-amber-700' : 'text-slate-700'} leading-none mb-2">n = k-1</div>
                    ${step >= 2 ? `<div class="text-[18px] font-bold text-slate-700 bg-white/80 rounded-lg px-1 py-0.5">a<sub>k-1</sub>=2<sup>k-1</sup></div>` : ''}
                  </div>
                  <span class="text-indigo-400 font-black text-4xl">+</span>
                  <div class="p-4 rounded-2xl border-4 text-center flex-1 transition-all duration-300 ${step === 2 ? 'bg-amber-50 border-amber-500 shadow-xl scale-105' : 'bg-white border-indigo-200'}">
                    <div class="font-extrabold text-[28px] ${step === 2 ? 'text-amber-700' : 'text-slate-700'} leading-none mb-2">n = k</div>
                    ${step >= 2 ? `<div class="text-[18px] font-bold text-slate-700 bg-white/80 rounded-lg px-1 py-0.5">a<sub>k</sub>=2<sup>k</sup></div>` : ''}
                  </div>
                </div>
              </div>

              <!-- Merging Arrow SVG -->
              <div class="w-full h-10 flex justify-center items-center transition-all duration-500 ${step >= 3 ? 'opacity-100 text-indigo-600' : 'opacity-20 text-slate-300'}">
                <svg class="w-[50%] h-full overflow-visible" viewBox="0 0 100 40" preserveAspectRatio="none">
                  <path d="M 20,0 Q 20,20 50,30" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="5,4" />
                  <path d="M 80,0 Q 80,20 50,30" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="5,4" />
                  <polygon points="45,25 55,25 50,38" fill="currentColor" />
                </svg>
              </div>

              <!-- Inductive Step (Target) -->
              <div class="flex flex-col items-center transition-all duration-500 w-full max-w-[420px] ${step >= 3 ? 'opacity-100' : 'opacity-20 blur-[2px]'}">
                <div class="w-full p-4 rounded-2xl border-4 text-center transition-all duration-300 ${step === 3 ? 'bg-indigo-50 border-indigo-600 shadow-2xl scale-105' : 'bg-white border-indigo-200'}">
                  <div class="font-extrabold text-[28px] ${step === 3 ? 'text-indigo-900' : 'text-slate-700'} leading-none mb-2">n = k + 1</div>
                  ${step >= 3 ? `
                    <div class="text-[20px] font-bold text-slate-800 bg-white/80 rounded-lg px-3 py-1.5 leading-snug">
                      3(2<sup>k</sup>) - 2(2<sup>k-1</sup>)<br/>
                      = 3·2<sup>k</sup> - 2<sup>k</sup> = 2<sup>k+1</sup>
                    </div>
                  ` : ''}
                </div>
              </div>
            </div>

            <!-- 도미노 효과 -->
            <div class="w-full flex flex-col items-center bg-indigo-100/50 rounded-2xl px-4 border-2 border-indigo-200 transition-all duration-500 overflow-hidden ${step === 4 ? 'py-4 max-h-[160px] opacity-100 mt-4' : 'py-0 max-h-0 opacity-0 border-transparent mt-0'} shrink-0">
              <div class="text-[16px] font-black text-indigo-900 mb-3">앞뒤로 밀착된 2개가 쌍이 되어 밀기</div>
              <div class="flex items-end h-[80px] mr-14">
                ${FrontBackDomino(100, step === 4, false)}
                ${FrontBackDomino(350, step === 4, true)}
              </div>
            </div>

          </div>
        </div>
      `;
    }

    // 초기 화면 렌더링
    render();
  </script>
</body>
</html>
