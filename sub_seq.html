<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수학적 귀납법 시각화</title>
  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 폰트 및 애니메이션 커스텀 설정 */
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; }
    
    .domino {
      transform-origin: bottom right;
      transition: all 0.3s ease-in;
    }
    .falling {
      transform: rotate(65deg) translateX(1rem);
      opacity: 0.95;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-gray-200 min-h-screen flex items-center justify-center p-2 text-gray-800">

  <!-- React를 대체할 루트 컨테이너 -->
  <div id="app-root" class="w-full max-w-6xl bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[98vh]"></div>

  <script>
    // --- 상태 관리 ---
    let step = 0;

    const explanations = [
      { title: "도입: 항의 개수 비교", desc: "일반 귀납법과 강한 귀납법(피보나치)에서 다음 항을 증명하기 위해 몇 개의 이전 항이 필요한지 비교합니다." },
      { title: "Step 1: 기본 단계 (시작점)", desc: "일반 귀납법은 1개의 시작점(n=1)만 필요하지만, 강한 귀납법은 2개의 시작점(n=1, n=2)이 참임을 증명해야 합니다." },
      { title: "Step 2: 귀납 가정", desc: "일반 귀납법은 바로 앞 1개(n=k)만 참이라 가정하지만, 강한 귀납법은 최소 앞 2개(n=k-1, n=k)를 참이라 가정합니다." },
      { title: "Step 3: 귀납 단계 (증명)", desc: "일반 귀납법은 1개로 다음 1개를 증명하지만, 강한 귀납법은 2개를 '합쳐서' 다음 1개를 증명합니다." },
      { title: "Step 4: 도미노 비유 (시각화)", desc: "일반 귀납법은 도미노가 1:1로 쓰러집니다. 강한 귀납법은 무거운 도미노를 쓰러뜨리기 위해 2개가 동시에 힘을 합칩니다." }
    ];

    // --- 액션 함수 ---
    function nextStep() { if (step < 4) { step++; render(); } }
    function prevStep() { if (step > 0) { step--; render(); } }
    function resetStep() { step = 0; render(); }

    // --- 컴포넌트 (도미노 & 아이콘) ---
    function StandardDomino(delay, isFalling, colorClass = "from-blue-400 to-blue-600 border-blue-700") {
      return `
        <div class="relative w-8 h-20 bg-gradient-to-b ${colorClass} rounded-sm shadow-md border domino ${isFalling ? 'falling' : 'opacity-100'}" style="transition-delay: ${delay}ms">
          <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-5 border-t-2 border-white/60"></div>
          <div class="absolute top-4 left-1/2 -translate-x-1/2 w-2 h-2 bg-white/90 rounded-full shadow-inner"></div>
          <div class="absolute bottom-4 left-1/2 -translate-x-1/2 w-2 h-2 bg-white/90 rounded-full shadow-inner"></div>
        </div>`;
    }

    function HeavyDomino(delay, isFalling) {
      return `
        <div class="relative w-12 h-24 bg-gradient-to-b from-indigo-600 to-indigo-800 rounded-md shadow-xl border-2 border-indigo-900 domino ${isFalling ? 'falling' : 'opacity-100'}" style="transition-delay: ${delay}ms">
          <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-8 border-t-[3px] border-white/60"></div>
          <div class="absolute top-5 left-1/2 -translate-x-1/2 w-2.5 h-2.5 bg-white/90 rounded-full shadow-inner"></div>
          <div class="absolute bottom-5 left-1/2 -translate-x-1/2 w-2.5 h-2.5 bg-white/90 rounded-full shadow-inner"></div>
        </div>`;
    }

    function ArrowSVG(isActive, isBounce) {
      return `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="transition-all duration-300 ${isActive ? 'text-slate-400' : 'text-slate-200'} ${isBounce ? 'animate-bounce text-emerald-500' : ''}"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>`;
    }

    // --- 렌더링 함수 ---
    function render() {
      const root = document.getElementById('app-root');
      
      root.innerHTML = `
        <!-- Header -->
        <div class="bg-slate-800 text-white py-2 px-6 flex justify-between items-center shrink-0">
          <h1 class="text-xl font-extrabold tracking-wide">수학적 귀납법 비교 시각화</h1>
        </div>

        <!-- Controls & Explanation -->
        <div class="px-4 py-3 bg-blue-50/80 border-b border-blue-200 flex flex-row items-center justify-between gap-4 shrink-0">
          <div class="flex-1 text-left">
            <h2 class="text-xl font-extrabold text-blue-900 mb-1 flex items-center justify-start gap-2">
              <span class="bg-blue-600 text-white w-7 h-7 rounded-full flex items-center justify-center text-sm shadow">${step}</span>
              ${explanations[step].title}
            </h2>
            <p class="text-blue-800 text-base font-medium">
              ${explanations[step].desc}
            </p>
          </div>
          <div class="flex gap-2 bg-white p-1.5 rounded-xl shadow-sm border border-blue-100 shrink-0">
            <button onclick="prevStep()" ${step === 0 ? 'disabled' : ''} class="p-2 text-gray-600 hover:bg-gray-100 hover:text-blue-600 rounded-lg disabled:opacity-30 transition-all">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <button onclick="resetStep()" class="p-2 text-gray-600 hover:bg-gray-100 hover:text-blue-600 rounded-lg transition-all" title="초기화">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            </button>
            <button onclick="nextStep()" ${step === 4 ? 'disabled' : ''} class="px-5 py-2 bg-blue-600 text-white text-base font-bold rounded-lg hover:bg-blue-700 disabled:opacity-30 transition-all flex items-center gap-1 shadow-md">
              다음 단계 <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
            </button>
          </div>
        </div>

        <!-- Visualization Canvas -->
        <div class="p-4 grid grid-cols-1 md:grid-cols-2 gap-4 overflow-y-auto flex-1 bg-gray-100/50 pb-8">
          
          <!-- Left: Standard Induction -->
          <div class="flex flex-col items-center bg-white border-2 border-slate-200 rounded-2xl p-4 shadow-sm relative h-max">
            <div class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-slate-700 text-white text-base font-bold px-6 py-1.5 rounded-full shadow-lg">
              일반 수학적 귀납법
            </div>
            
            <p class="text-[26px] text-slate-800 mb-4 mt-4 font-black bg-slate-50 px-6 py-3 rounded-xl shadow-inner border border-slate-200 w-full text-center">
              a<sub>k+1</sub> = 2a<sub>k</sub> <span class="text-lg text-slate-500 font-bold ml-1">(등비수열)</span>
            </p>
            
            <div class="flex flex-col items-center w-full flex-1 justify-center space-y-2">
              
              <!-- Base Step -->
              <div class="flex flex-col items-center transition-all duration-500 w-full max-w-[240px] ${step >= 1 ? 'opacity-100' : 'opacity-20 blur-[2px]'}">
                <div class="w-full p-3 rounded-xl border-[3px] text-center transition-all duration-300 ${step === 1 ? 'bg-emerald-50 border-emerald-500 shadow-lg scale-105' : 'bg-white border-slate-200'}">
                  <div class="font-extrabold text-[22px] ${step === 1 ? 'text-emerald-700' : 'text-slate-700'}">n = 1</div>
                  ${step >= 1 ? `<div class="text-lg font-bold mt-1 text-slate-700 bg-white/80 rounded px-2">a<sub>1</sub> = 2<sup>1</sup> = 2 (참)</div>` : ''}
                </div>
                ${step >= 1 ? `<span class="text-sm text-emerald-600 font-extrabold mt-1 tracking-tight">시작점 1개</span>` : ''}
              </div>

              ${ArrowSVG(step >= 1, step === 1)}

              <!-- Inductive Hypothesis -->
              <div class="flex flex-col items-center transition-all duration-500 w-full max-w-[240px] ${step >= 2 ? 'opacity-100' : 'opacity-20 blur-[2px]'}">
                <div class="w-full p-3 rounded-xl border-[3px] text-center transition-all duration-300 ${step === 2 ? 'bg-amber-50 border-amber-500 shadow-lg scale-105' : 'bg-white border-slate-200'}">
                  <div class="font-extrabold text-[22px] ${step === 2 ? 'text-amber-700' : 'text-slate-700'}">n = k</div>
                  ${step >= 2 ? `<div class="text-lg font-bold mt-1 text-slate-700 bg-white/80 rounded px-2">a<sub>k</sub> = 2<sup>k</sup> 가정</div>` : ''}
                </div>
                ${step >= 2 ? `<span class="text-sm text-amber-600 font-extrabold mt-1 tracking-tight">가정 1개</span>` : ''}
              </div>

              ${ArrowSVG(step >= 2, step === 2)}

              <!-- Inductive Step (Target) -->
              <div class="flex flex-col items-center transition-all duration-500 w-full max-w-[260px] ${step >= 3 ? 'opacity-100' : 'opacity-20 blur-[2px]'}">
                <div class="w-full p-3 rounded-xl border-[3px] text-center transition-all duration-300 ${step === 3 ? 'bg-blue-50 border-blue-600 shadow-xl scale-110' : 'bg-white border-slate-200'}">
                  <div class="font-extrabold text-[22px] ${step === 3 ? 'text-blue-800' : 'text-slate-700'}">n = k + 1</div>
                  ${step >= 3 ? `
                    <div class="text-[17px] font-bold mt-1 text-slate-800 bg-white/80 rounded px-2 py-1 leading-tight">
                      a<sub>k+1</sub> = 2(a<sub>k</sub>) <br/>= 2(2<sup>k</sup>) = 2<sup>k+1</sup>
                    </div>
                  ` : ''}
                </div>
                ${step >= 3 ? `<span class="text-base text-blue-700 font-black mt-2 flex items-center gap-1"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg> 증명 완료</span>` : ''}
              </div>
            </div>
            
            <!-- 도미노 효과 -->
            <div class="mt-6 w-full flex flex-col items-center bg-blue-50 rounded-xl px-4 border-2 border-blue-100 transition-all duration-700 overflow-hidden ${step === 4 ? 'py-5 max-h-[200px] opacity-100' : 'py-0 max-h-0 opacity-0 border-transparent'}">
              <div class="text-base font-black text-blue-900 mb-4">도미노 비유: 1대1 연쇄 작용</div>
              <div class="flex gap-2.5 items-end h-[100px] mr-8">
                ${StandardDomino(100, step === 4)}
                ${StandardDomino(300, step === 4)}
                ${StandardDomino(500, step === 4)}
                ${StandardDomino(700, step === 4, "from-blue-600 to-blue-800 border-blue-900")}
              </div>
            </div>
          </div>

          <!-- Right: Strong Induction -->
          <div class="flex flex-col items-center bg-indigo-50/40 border-2 border-indigo-200 rounded-2xl p-4 shadow-sm relative h-max">
            <div class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-indigo-700 text-white text-base font-bold px-6 py-1.5 rounded-full shadow-lg">
              강한 수학적 귀납법
            </div>

            <p class="text-[26px] text-indigo-900 mb-4 mt-4 font-black bg-indigo-100/70 px-6 py-3 rounded-xl shadow-inner border border-indigo-300 w-full text-center">
              a<sub>k+1</sub> = a<sub>k</sub> + a<sub>k-1</sub> <span class="text-lg text-indigo-600 font-bold ml-1">(피보나치)</span>
            </p>
            
            <div class="flex flex-col items-center w-full flex-1 justify-center space-y-2">
              
              <!-- Base Step -->
              <div class="flex flex-col items-center w-full transition-all duration-500 ${step >= 1 ? 'opacity-100' : 'opacity-20 blur-[2px]'}">
                <div class="flex items-center justify-center gap-2 w-full px-2">
                  <div class="p-3 rounded-xl border-[3px] text-center flex-1 transition-all duration-300 ${step === 1 ? 'bg-emerald-50 border-emerald-500 shadow-lg scale-105' : 'bg-white border-indigo-200'}">
                    <div class="font-extrabold text-[22px] ${step === 1 ? 'text-emerald-700' : 'text-slate-700'}">n = 1</div>
                    ${step >= 1 ? `<div class="text-[17px] font-bold mt-1 text-slate-700 bg-white/80 rounded px-1">a<sub>1</sub> < 2<sup>1</sup></div>` : ''}
                  </div>
                  <span class="text-indigo-400 font-black text-3xl">+</span>
                  <div class="p-3 rounded-xl border-[3px] text-center flex-1 transition-all duration-300 ${step === 1 ? 'bg-emerald-50 border-emerald-500 shadow-lg scale-105' : 'bg-white border-indigo-200'}">
                    <div class="font-extrabold text-[22px] ${step === 1 ? 'text-emerald-700' : 'text-slate-700'}">n = 2</div>
                    ${step >= 1 ? `<div class="text-[17px] font-bold mt-1 text-slate-700 bg-white/80 rounded px-1">a<sub>2</sub> < 2<sup>2</sup></div>` : ''}
                  </div>
                </div>
                ${step >= 1 ? `<span class="text-sm text-emerald-600 font-extrabold mt-1 tracking-tight">시작점 2개</span>` : ''}
              </div>

              <div class="flex justify-center w-full gap-24 relative h-6">
                <div class="absolute left-1/4 -translate-x-1/2">${ArrowSVG(step >= 1, step === 1)}</div>
                <div class="absolute right-1/4 translate-x-1/2">${ArrowSVG(step >= 1, step === 1)}</div>
              </div>

              <!-- Inductive Hypothesis -->
              <div class="flex flex-col items-center w-full transition-all duration-500 ${step >= 2 ? 'opacity-100' : 'opacity-20 blur-[2px]'}">
                <div class="flex items-center justify-center gap-2 w-full px-2">
                  <div class="p-3 rounded-xl border-[3px] text-center flex-1 transition-all duration-300 ${step === 2 ? 'bg-amber-50 border-amber-500 shadow-lg scale-105' : 'bg-white border-indigo-200'}">
                    <div class="font-extrabold text-[22px] ${step === 2 ? 'text-amber-700' : 'text-slate-700'}">n = k-1</div>
                    ${step >= 2 ? `<div class="text-[17px] font-bold mt-1 text-slate-700 bg-white/80 rounded px-1">a<sub>k-1</sub> < 2<sup>k-1</sup></div>` : ''}
                  </div>
                  <span class="text-indigo-400 font-black text-3xl">+</span>
                  <div class="p-3 rounded-xl border-[3px] text-center flex-1 transition-all duration-300 ${step === 2 ? 'bg-amber-50 border-amber-500 shadow-lg scale-105' : 'bg-white border-indigo-200'}">
                    <div class="font-extrabold text-[22px] ${step === 2 ? 'text-amber-700' : 'text-slate-700'}">n = k</div>
                    ${step >= 2 ? `<div class="text-[17px] font-bold mt-1 text-slate-700 bg-white/80 rounded px-1">a<sub>k</sub> < 2<sup>k</sup></div>` : ''}
                  </div>
                </div>
                ${step >= 2 ? `<span class="text-sm text-amber-600 font-extrabold mt-1 tracking-tight">가정 2개가 동시에 필요</span>` : ''}
              </div>

              <!-- Merging Arrow SVG -->
              <div class="w-full h-10 flex justify-center items-center transition-all duration-500 ${step >= 3 ? 'opacity-100 text-indigo-600' : 'opacity-20 text-slate-300'}">
                <svg class="w-[60%] h-full overflow-visible" viewBox="0 0 100 40" preserveAspectRatio="none">
                  <path d="M 20,0 Q 20,20 50,35" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="5,4" />
                  <path d="M 80,0 Q 80,20 50,35" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="5,4" />
                  <polygon points="45,30 55,30 50,40" fill="currentColor" />
                </svg>
              </div>

              <!-- Inductive Step (Target) -->
              <div class="flex flex-col items-center transition-all duration-500 w-full max-w-[300px] ${step >= 3 ? 'opacity-100' : 'opacity-20 blur-[2px]'}">
                <div class="w-full p-3 rounded-xl border-[3px] text-center transition-all duration-300 ${step === 3 ? 'bg-indigo-50 border-indigo-600 shadow-2xl scale-110' : 'bg-white border-indigo-200'}">
                  <div class="font-extrabold text-[22px] ${step === 3 ? 'text-indigo-900' : 'text-slate-700'}">n = k + 1</div>
                  ${step >= 3 ? `
                    <div class="text-[17px] font-bold mt-1 text-slate-800 bg-white/80 rounded px-2 py-1 leading-tight">
                      a<sub>k+1</sub> = a<sub>k</sub> + a<sub>k-1</sub><br/>
                      <span class="text-[16px] text-indigo-700 font-black">&lt; 2<sup>k</sup> + 2<sup>k-1</sup> &lt; 2<sup>k+1</sup></span>
                    </div>
                  ` : ''}
                </div>
                ${step >= 3 ? `<span class="text-base text-indigo-800 font-black mt-3 flex items-center gap-1"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg> 2개가 모여 증명 완료!</span>` : ''}
              </div>
            </div>

            <!-- 도미노 효과 -->
            <div class="mt-6 w-full flex flex-col items-center bg-indigo-100/50 rounded-xl px-4 border-2 border-indigo-200 transition-all duration-700 overflow-hidden ${step === 4 ? 'py-5 max-h-[200px] opacity-100' : 'py-0 max-h-0 opacity-0 border-transparent'}">
              <div class="text-base font-black text-indigo-900 mb-4">도미노 비유: 2개가 합쳐서 밀기</div>
              <div class="flex gap-3 items-end h-[100px] mr-10">
                <div class="flex gap-1 items-end">
                  ${StandardDomino(100, step === 4, "from-indigo-400 to-indigo-500 border-indigo-600")}
                  ${StandardDomino(150, step === 4, "from-indigo-400 to-indigo-500 border-indigo-600")}
                </div>
                ${HeavyDomino(450, step === 4)}
              </div>
            </div>

          </div>
        </div>
      `;
    }

    // 초기 화면 렌더링
    render();
  </script>
</body>
</html>
