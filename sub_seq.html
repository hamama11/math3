<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수학적 귀납법 시각화</title>
  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 폰트 및 애니메이션 커스텀 설정 */
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; }
    
    .domino {
      transform-origin: bottom right;
    }
    
    @keyframes fall {
      0% { transform: rotate(0deg) translateX(0); opacity: 1; }
      100% { transform: rotate(65deg) translateX(1rem); opacity: 0.95; }
    }
    
    .falling {
      animation: fall 0.3s ease-in both;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-gray-200 min-h-screen flex items-center justify-center p-2 text-gray-800">

  <!-- React를 대체할 루트 컨테이너 -->
  <div id="app-root" class="w-full max-w-6xl bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[98vh]"></div>

  <script>
    // --- 상태 관리 ---
    let step = 0;

    const explanations = [
      { title: "도입: 항의 개수 비교", desc: "일반 귀납법과 강한 귀납법(피보나치)에서 다음 항을 증명하기 위해 몇 개의 이전 항이 필요한지 비교합니다." },
      { title: "Step 1: 기본 단계 (시작점)", desc: "일반 귀납법은 1개의 시작점(n=1)만 필요하지만, 강한 귀납법은 2개의 시작점(n=1, n=2)이 참임을 증명해야 합니다." },
      { title: "Step 2: 귀납 가정", desc: "일반 귀납법은 바로 앞 1개(n=k)만 참이라 가정하지만, 강한 귀납법은 최소 앞 2개(n=k-1, n=k)를 참이라 가정합니다." },
      { title: "Step 3: 귀납 단계 (증명)", desc: "일반 귀납법은 1개로 다음 1개를 증명하지만, 강한 귀납법은 2개를 '합쳐서' 다음 1개를 증명합니다." },
      { title: "Step 4: 도미노 비유 (시각화)", desc: "일반 귀납법은 도미노가 1:1로 쓰러집니다. 강한 귀납법은 무거운 도미노를 쓰러뜨리기 위해 2개가 동시에 힘을 합칩니다." }
    ];

    // --- 액션 함수 ---
    function nextStep() { if (step < 4) { step++; render(); } }
    function prevStep() { if (step > 0) { step--; render(); } }
    function resetStep() { step = 0; render(); }

    // --- 컴포넌트 (도미노 & 아이콘) ---
    function StandardDomino(delay, isFalling, colorClass = "from-blue-400 to-blue-600 border-blue-700") {
      return `
        <div class="relative w-6 h-14 bg-gradient-to-b ${colorClass} rounded-sm shadow-md border domino ${isFalling ? 'falling' : 'opacity-100'}" style="${isFalling ? `animation-delay: ${delay}ms;` : ''}">
          <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-4 border-t-[1.5px] border-white/60"></div>
          <div class="absolute top-2 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-white/90 rounded-full shadow-inner"></div>
          <div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-white/90 rounded-full shadow-inner"></div>
        </div>`;
    }

    function HeavyDomino(delay, isFalling) {
      return `
        <div class="relative w-10 h-20 bg-gradient-to-b from-indigo-600 to-indigo-800 rounded-md shadow-xl border-2 border-indigo-900 domino ${isFalling ? 'falling' : 'opacity-100'}" style="${isFalling ? `animation-delay: ${delay}ms;` : ''}">
          <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-6 border-t-[2px] border-white/60"></div>
          <div class="absolute top-3 left-1/2 -translate-x-1/2 w-2 h-2 bg-white/90 rounded-full shadow-inner"></div>
          <div class="absolute bottom-3 left-1/2 -translate-x-1/2 w-2 h-2 bg-white/90 rounded-full shadow-inner"></div>
        </div>`;
    }

    function ArrowSVG(isActive, isBounce) {
      return `<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="transition-all duration-300 ${isActive ? 'text-slate-400' : 'text-slate-200'} ${isBounce ? 'animate-bounce text-emerald-500' : ''}"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>`;
    }

    // --- 렌더링 함수 ---
    function render() {
      const root = document.getElementById('app-root');
      
      root.innerHTML = `
        <!-- Header -->
        <div class="bg-slate-800 text-white py-1.5 px-6 flex justify-between items-center shrink-0">
          <h1 class="text-lg font-extrabold tracking-wide">수학적 귀납법 비교 시각화</h1>
        </div>

        <!-- Controls & Explanation -->
        <div class="px-4 py-2 bg-blue-50/80 border-b border-blue-200 flex flex-row items-center justify-between gap-3 shrink-0">
          <div class="flex-1 text-left">
            <h2 class="text-lg font-extrabold text-blue-900 mb-0.5 flex items-center justify-start gap-2">
              <span class="bg-blue-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs shadow">${step}</span>
              ${explanations[step].title}
            </h2>
            <p class="text-blue-800 text-sm font-medium leading-tight">
              ${explanations[step].desc}
            </p>
          </div>
          <div class="flex gap-1.5 bg-white p-1 rounded-xl shadow-sm border border-blue-100 shrink-0">
            <button onclick="prevStep()" ${step === 0 ? 'disabled' : ''} class="p-1.5 text-gray-600 hover:bg-gray-100 hover:text-blue-600 rounded-lg disabled:opacity-30 transition-all">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <button onclick="resetStep()" class="p-1.5 text-gray-600 hover:bg-gray-100 hover:text-blue-600 rounded-lg transition-all" title="초기화">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            </button>
            <button onclick="nextStep()" ${step === 4 ? 'disabled' : ''} class="px-3 py-1.5 bg-blue-600 text-white text-sm font-bold rounded-lg hover:bg-blue-700 disabled:opacity-30 transition-all flex items-center gap-1 shadow-md">
              다음 <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
            </button>
          </div>
        </div>

        <!-- Visualization Canvas -->
        <div class="p-2 md:p-3 grid grid-cols-1 md:grid-cols-2 gap-3 overflow-hidden flex-1 bg-gray-100/50">
          
          <!-- Left: Standard Induction -->
          <div class="flex flex-col items-center bg-white border-2 border-slate-200 rounded-2xl p-3 shadow-sm relative h-full justify-between">
            <div class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-slate-700 text-white text-sm font-bold px-4 py-1 rounded-full shadow-md whitespace-nowrap">
              일반 수학적 귀납법
            </div>
            
            <p class="text-[22px] text-slate-800 mb-2 mt-3 font-black bg-slate-50 px-4 py-2 rounded-xl shadow-inner border border-slate-200 w-full text-center shrink-0">
              a<sub>k+1</sub> = 2a<sub>k</sub> <span class="text-sm text-slate-500 font-bold ml-1">(등비수열)</span>
            </p>
            
            <div class="flex flex-col items-center w-full flex-1 justify-center space-y-1.5 my-1">
              
              <!-- Base Step -->
              <div class="flex flex-col items-center transition-all duration-500 w-full max-w-[220px] ${step >= 1 ? 'opacity-100' : 'opacity-20 blur-[1px]'}">
                <div class="w-full p-2 rounded-xl border-2 text-center transition-all duration-300 ${step === 1 ? 'bg-emerald-50 border-emerald-500 shadow-md scale-105' : 'bg-white border-slate-200'}">
                  <div class="font-extrabold text-[19px] ${step === 1 ? 'text-emerald-700' : 'text-slate-700'} leading-tight">n = 1</div>
                  ${step >= 1 ? `<div class="text-[16px] font-bold mt-0.5 text-slate-700 bg-white/80 rounded px-1">a<sub>1</sub> = 2<sup>1</sup> = 2 (참)</div>` : ''}
                </div>
              </div>

              ${ArrowSVG(step >= 1, step === 1)}

              <!-- Inductive Hypothesis -->
              <div class="flex flex-col items-center transition-all duration-500 w-full max-w-[220px] ${step >= 2 ? 'opacity-100' : 'opacity-20 blur-[1px]'}">
                <div class="w-full p-2 rounded-xl border-2 text-center transition-all duration-300 ${step === 2 ? 'bg-amber-50 border-amber-500 shadow-md scale-105' : 'bg-white border-slate-200'}">
                  <div class="font-extrabold text-[19px] ${step === 2 ? 'text-amber-700' : 'text-slate-700'} leading-tight">n = k</div>
                  ${step >= 2 ? `<div class="text-[16px] font-bold mt-0.5 text-slate-700 bg-white/80 rounded px-1">a<sub>k</sub> = 2<sup>k</sup> 가정</div>` : ''}
                </div>
              </div>

              ${ArrowSVG(step >= 2, step === 2)}

              <!-- Inductive Step (Target) -->
              <div class="flex flex-col items-center transition-all duration-500 w-full max-w-[240px] ${step >= 3 ? 'opacity-100' : 'opacity-20 blur-[1px]'}">
                <div class="w-full p-2 rounded-xl border-2 text-center transition-all duration-300 ${step === 3 ? 'bg-blue-50 border-blue-600 shadow-lg scale-105' : 'bg-white border-slate-200'}">
                  <div class="font-extrabold text-[19px] ${step === 3 ? 'text-blue-800' : 'text-slate-700'} leading-tight">n = k + 1</div>
                  ${step >= 3 ? `
                    <div class="text-[16px] font-bold mt-0.5 text-slate-800 bg-white/80 rounded px-1 leading-snug">
                      2(a<sub>k</sub>) = 2(2<sup>k</sup>) = 2<sup>k+1</sup>
                    </div>
                  ` : ''}
                </div>
              </div>
            </div>
            
            <!-- 도미노 효과 -->
            <div class="w-full flex flex-col items-center bg-blue-50 rounded-xl px-2 border-2 border-blue-100 transition-all duration-500 overflow-hidden ${step === 4 ? 'py-2 max-h-[100px] opacity-100 mt-2' : 'py-0 max-h-0 opacity-0 border-transparent mt-0'} shrink-0">
              <div class="text-[13px] font-black text-blue-900 mb-1.5">1대1 연쇄 작용</div>
              <div class="flex gap-2 items-end h-[60px] mr-6">
                ${StandardDomino(100, step === 4)}
                ${StandardDomino(300, step === 4)}
                ${StandardDomino(500, step === 4)}
                ${StandardDomino(700, step === 4, "from-blue-600 to-blue-800 border-blue-900")}
              </div>
            </div>
          </div>

          <!-- Right: Strong Induction -->
          <div class="flex flex-col items-center bg-indigo-50/40 border-2 border-indigo-200 rounded-2xl p-3 shadow-sm relative h-full justify-between">
            <div class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-indigo-700 text-white text-sm font-bold px-4 py-1 rounded-full shadow-md whitespace-nowrap">
              강한 수학적 귀납법
            </div>

            <p class="text-[22px] text-indigo-900 mb-2 mt-3 font-black bg-indigo-100/70 px-4 py-2 rounded-xl shadow-inner border border-indigo-300 w-full text-center shrink-0">
              a<sub>k+1</sub> = a<sub>k</sub> + a<sub>k-1</sub> <span class="text-sm text-indigo-600 font-bold ml-1">(피보나치)</span>
            </p>
            
            <div class="flex flex-col items-center w-full flex-1 justify-center space-y-1.5 my-1">
              
              <!-- Base Step -->
              <div class="flex flex-col items-center w-full transition-all duration-500 ${step >= 1 ? 'opacity-100' : 'opacity-20 blur-[1px]'}">
                <div class="flex items-center justify-center gap-2 w-full px-1">
                  <div class="p-2 rounded-xl border-2 text-center flex-1 transition-all duration-300 ${step === 1 ? 'bg-emerald-50 border-emerald-500 shadow-md scale-105' : 'bg-white border-indigo-200'}">
                    <div class="font-extrabold text-[19px] ${step === 1 ? 'text-emerald-700' : 'text-slate-700'} leading-tight">n = 1</div>
                    ${step >= 1 ? `<div class="text-[16px] font-bold mt-0.5 text-slate-700 bg-white/80 rounded px-1">a<sub>1</sub> < 2<sup>1</sup></div>` : ''}
                  </div>
                  <span class="text-indigo-400 font-black text-2xl">+</span>
                  <div class="p-2 rounded-xl border-2 text-center flex-1 transition-all duration-300 ${step === 1 ? 'bg-emerald-50 border-emerald-500 shadow-md scale-105' : 'bg-white border-indigo-200'}">
                    <div class="font-extrabold text-[19px] ${step === 1 ? 'text-emerald-700' : 'text-slate-700'} leading-tight">n = 2</div>
                    ${step >= 1 ? `<div class="text-[16px] font-bold mt-0.5 text-slate-700 bg-white/80 rounded px-1">a<sub>2</sub> < 2<sup>2</sup></div>` : ''}
                  </div>
                </div>
              </div>

              <div class="flex justify-center w-full gap-20 relative h-5">
                <div class="absolute left-1/4 -translate-x-1/2">${ArrowSVG(step >= 1, step === 1)}</div>
                <div class="absolute right-1/4 translate-x-1/2">${ArrowSVG(step >= 1, step === 1)}</div>
              </div>

              <!-- Inductive Hypothesis -->
              <div class="flex flex-col items-center w-full transition-all duration-500 ${step >= 2 ? 'opacity-100' : 'opacity-20 blur-[1px]'}">
                <div class="flex items-center justify-center gap-2 w-full px-1">
                  <div class="p-2 rounded-xl border-2 text-center flex-1 transition-all duration-300 ${step === 2 ? 'bg-amber-50 border-amber-500 shadow-md scale-105' : 'bg-white border-indigo-200'}">
                    <div class="font-extrabold text-[19px] ${step === 2 ? 'text-amber-700' : 'text-slate-700'} leading-tight">n = k-1</div>
                    ${step >= 2 ? `<div class="text-[16px] font-bold mt-0.5 text-slate-700 bg-white/80 rounded px-1">a<sub>k-1</sub> < 2<sup>k-1</sup></div>` : ''}
                  </div>
                  <span class="text-indigo-400 font-black text-2xl">+</span>
                  <div class="p-2 rounded-xl border-2 text-center flex-1 transition-all duration-300 ${step === 2 ? 'bg-amber-50 border-amber-500 shadow-md scale-105' : 'bg-white border-indigo-200'}">
                    <div class="font-extrabold text-[19px] ${step === 2 ? 'text-amber-700' : 'text-slate-700'} leading-tight">n = k</div>
                    ${step >= 2 ? `<div class="text-[16px] font-bold mt-0.5 text-slate-700 bg-white/80 rounded px-1">a<sub>k</sub> < 2<sup>k</sup></div>` : ''}
                  </div>
                </div>
              </div>

              <!-- Merging Arrow SVG -->
              <div class="w-full h-6 flex justify-center items-center transition-all duration-500 ${step >= 3 ? 'opacity-100 text-indigo-600' : 'opacity-20 text-slate-300'}">
                <svg class="w-[50%] h-full overflow-visible" viewBox="0 0 100 30" preserveAspectRatio="none">
                  <path d="M 20,0 Q 20,15 50,25" fill="none" stroke="currentColor" stroke-width="2.5" stroke-dasharray="4,3" />
                  <path d="M 80,0 Q 80,15 50,25" fill="none" stroke="currentColor" stroke-width="2.5" stroke-dasharray="4,3" />
                  <polygon points="46,20 54,20 50,30" fill="currentColor" />
                </svg>
              </div>

              <!-- Inductive Step (Target) -->
              <div class="flex flex-col items-center transition-all duration-500 w-full max-w-[280px] ${step >= 3 ? 'opacity-100' : 'opacity-20 blur-[1px]'}">
                <div class="w-full p-2 rounded-xl border-2 text-center transition-all duration-300 ${step === 3 ? 'bg-indigo-50 border-indigo-600 shadow-lg scale-105' : 'bg-white border-indigo-200'}">
                  <div class="font-extrabold text-[19px] ${step === 3 ? 'text-indigo-900' : 'text-slate-700'} leading-tight">n = k + 1</div>
                  ${step >= 3 ? `
                    <div class="text-[16px] font-bold mt-0.5 text-slate-800 bg-white/80 rounded px-1 leading-snug">
                      a<sub>k</sub>+a<sub>k-1</sub> &lt; 2<sup>k</sup>+2<sup>k-1</sup> &lt; 2<sup>k+1</sup>
                    </div>
                  ` : ''}
                </div>
              </div>
            </div>

            <!-- 도미노 효과 -->
            <div class="w-full flex flex-col items-center bg-indigo-100/50 rounded-xl px-2 border-2 border-indigo-200 transition-all duration-500 overflow-hidden ${step === 4 ? 'py-2 max-h-[100px] opacity-100 mt-2' : 'py-0 max-h-0 opacity-0 border-transparent mt-0'} shrink-0">
              <div class="text-[13px] font-black text-indigo-900 mb-1.5">2개가 합쳐서 밀기</div>
              <div class="flex gap-2.5 items-end h-[60px] mr-8">
                <div class="flex gap-0.5 items-end">
                  ${StandardDomino(100, step === 4, "from-indigo-400 to-indigo-500 border-indigo-600")}
                  ${StandardDomino(150, step === 4, "from-indigo-400 to-indigo-500 border-indigo-600")}
                </div>
                ${HeavyDomino(450, step === 4)}
              </div>
            </div>

          </div>
        </div>
      `;
    }

    // 초기 화면 렌더링
    render();
  </script>
</body>
</html>
