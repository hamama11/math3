<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>g(x) 분석 시뮬레이터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        canvas { touch-action: none; }
        .no-select { user-select: none; }
        /* Ensure the container takes full height but allows scrolling if needed */
        .app-container {
            min-height: calc(100vh - 2rem);
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-7xl flex flex-col md:flex-row overflow-hidden border border-slate-200 app-container">
        
        <!-- 왼쪽: 그래프 영역 -->
        <div id="container" class="flex-[3] bg-slate-50 relative p-4 border-r border-slate-100 min-h-[400px] md:min-h-[600px]">
            <canvas id="graphCanvas" class="w-full h-full cursor-crosshair"></canvas>
            
            <!-- 하단 범례 -->
            <div class="absolute bottom-6 left-6 flex flex-wrap gap-3 pointer-events-none no-select">
                <div class="bg-white/90 backdrop-blur-sm px-3 py-1.5 rounded-lg border border-slate-200 text-[10px] font-black text-slate-500 shadow-sm">
                    <span class="text-red-500 mr-1.5">●</span> f(x) Vertex
                </div>
                <div class="bg-white/90 backdrop-blur-sm px-3 py-1.5 rounded-lg border border-slate-200 text-[10px] font-black text-slate-500 shadow-sm">
                    <span class="text-amber-500 mr-1.5">━</span> y = t
                </div>
                <div class="bg-white/90 backdrop-blur-sm px-3 py-1.5 rounded-lg border border-slate-200 text-[10px] font-black text-slate-500 shadow-sm">
                    <span class="text-emerald-500 mr-1.5">━</span> g(x)
                </div>
            </div>
        </div>

        <!-- 오른쪽: 정보 및 컨트롤 패널 -->
        <div class="flex-[1.2] p-6 md:p-8 flex flex-col bg-white border-t md:border-t-0 overflow-y-auto">
            <header class="mb-6">
                <h1 class="text-3xl font-black text-slate-900 tracking-tighter leading-none mb-2 italic uppercase">g(x) Analysis</h1>
                <p class="text-slate-400 text-xs font-bold uppercase tracking-widest text-balance">Real-time intersection analysis</p>
            </header>

            <div class="space-y-5">
                <!-- 문제 이미지 (업로드된 이미지 사용) -->
                <section class="rounded-xl border border-slate-100 overflow-hidden shadow-sm bg-slate-50">
                    <img src="image_44f9b3.png" alt="Problem Statement" class="w-full h-auto" onerror="this.style.display='none'">
                </section>

                <!-- 실근 개수 패널 -->
                <section class="bg-amber-50 p-5 rounded-2xl border-2 border-amber-200 shadow-sm relative overflow-hidden">
                    <div id="countBadge" class="absolute -top-2 -right-2 opacity-10 font-black text-7xl text-amber-500 no-select">0</div>
                    <h3 class="text-[10px] font-black text-amber-600 uppercase tracking-widest mb-2">실근(교점) 분석: h(t)</h3>
                    <div class="flex items-end gap-2">
                        <div id="intersectionCount" class="text-5xl font-black text-amber-700 leading-none">0</div>
                        <div class="text-xs font-bold text-amber-800/70 mb-1 leading-tight">
                            개 (at y = <span id="valTText">0.0</span>)
                        </div>
                    </div>
                </section>

                <!-- 수식 정보 패널 -->
                <section class="bg-slate-50 p-5 rounded-2xl border border-slate-200">
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3 italic">Function State</h3>
                    <div class="space-y-2 text-sm font-bold font-mono">
                        <div class="flex justify-between items-center text-red-600 border-b border-red-100 pb-2">
                            <span>f(x)</span>
                            <span id="formulaF"></span>
                        </div>
                        <div class="flex justify-between items-center text-amber-600">
                            <span>Target t</span>
                            <span id="formulaT"></span>
                        </div>
                    </div>
                </section>

                <!-- 개형 설정 버튼 -->
                <section>
                    <div class="grid grid-cols-2 gap-2">
                        <button id="btnConvUp" class="py-3 rounded-xl text-xs font-black transition-all border-2 bg-indigo-600 border-indigo-600 text-white shadow-md">아래로 볼록</button>
                        <button id="btnConvDown" class="py-3 rounded-xl text-xs font-black transition-all border-2 bg-white border-slate-200 text-slate-400 hover:border-indigo-300">위로 볼록</button>
                    </div>
                </section>

                <!-- 수학적 통찰 -->
                <section class="bg-emerald-50 p-5 rounded-2xl border border-emerald-100">
                    <h3 class="text-xs font-black text-emerald-800 mb-2 uppercase italic tracking-wider">Geometric Insight</h3>
                    <p class="text-[11px] text-emerald-900/70 font-bold leading-relaxed">
                        g(x) = min{f(x), 4x}. <br>
                        h(t)의 불연속점은 접하거나 꺾이는 지점에서 발생합니다.
                    </p>
                </section>
            </div>

            <footer class="mt-8 pt-4 border-t border-slate-50 text-center">
                <p class="text-[9px] font-black text-slate-300 uppercase tracking-widest">
                    Interactive Math Visualization
                </p>
            </footer>
        </div>
    </div>

    <script>
        // State
        let p = 4, q = 4, a = 1, t = 15;
        let dragTarget = null;

        const canvas = document.getElementById('graphCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('container');

        // Coordinate constants - Adjusted for better visibility
        const PADDING = 50;
        const X_MIN = -5, X_MAX = 20;
        const Y_MIN = -15, Y_MAX = 55;

        const toCanvasX = (x) => PADDING + (x - X_MIN) * (canvas.width - 2 * PADDING) / (X_MAX - X_MIN);
        const toCanvasY = (y) => canvas.height - PADDING - (y - Y_MIN) * (canvas.height - 2 * PADDING) / (Y_MAX - Y_MIN);
        const fromCanvasX = (cx) => X_MIN + (cx - PADDING) * (X_MAX - X_MIN) / (canvas.width - 2 * PADDING);
        const fromCanvasY = (cy) => Y_MIN + (canvas.height - PADDING - cy) * (Y_MAX - Y_MIN) / (canvas.height - 2 * PADDING);

        const f = (x) => a * Math.pow(x - p, 2) + q;
        const line = (x) => 4 * x;
        const g = (x) => Math.min(f(x), line(x));

        function getIntersections() {
            const points = [];
            const step = 0.05;
            for (let x = X_MIN; x <= X_MAX; x += step) {
                const val1 = g(x);
                const val2 = g(x + step);
                if ((val1 <= t && val2 >= t) || (val1 >= t && val2 <= t)) {
                    points.push(x + step / 2);
                }
            }
            return points.filter((v, i, arr) => i === 0 || Math.abs(v - arr[i - 1]) > 0.5);
        }

        function updateUI() {
            const intersects = getIntersections();
            document.getElementById('intersectionCount').innerText = intersects.length;
            document.getElementById('countBadge').innerText = intersects.length;
            document.getElementById('valTText').innerText = t.toFixed(1);
            document.getElementById('formulaF').innerHTML = `${a === -1 ? '-' : ''}(x - ${p.toFixed(1)})² + ${q.toFixed(1)}`;
            document.getElementById('formulaT').innerText = `y = ${t.toFixed(1)}`;

            const btnUp = document.getElementById('btnConvUp');
            const btnDown = document.getElementById('btnConvDown');
            if(a === 1) {
                btnUp.className = "py-3 rounded-xl text-xs font-black transition-all border-2 bg-indigo-600 border-indigo-600 text-white shadow-md";
                btnDown.className = "py-3 rounded-xl text-xs font-black transition-all border-2 bg-white border-slate-200 text-slate-400 hover:border-indigo-300";
            } else {
                btnDown.className = "py-3 rounded-xl text-xs font-black transition-all border-2 bg-indigo-600 border-indigo-600 text-white shadow-md";
                btnUp.className = "py-3 rounded-xl text-xs font-black transition-all border-2 bg-white border-slate-200 text-slate-400 hover:border-indigo-300";
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Grid
            ctx.strokeStyle = '#f8fafc';
            ctx.lineWidth = 1;
            for (let x = Math.floor(X_MIN); x <= X_MAX; x += 2) {
                ctx.beginPath(); ctx.moveTo(toCanvasX(x), toCanvasY(Y_MIN)); ctx.lineTo(toCanvasX(x), toCanvasY(Y_MAX)); ctx.stroke();
            }
            for (let y = Math.floor(Y_MIN / 10) * 10; y <= Y_MAX; y += 10) {
                ctx.beginPath(); ctx.moveTo(toCanvasX(X_MIN), toCanvasY(y)); ctx.lineTo(toCanvasX(X_MAX), toCanvasY(y)); ctx.stroke();
            }

            // Axes
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(toCanvasX(X_MIN), toCanvasY(0)); ctx.lineTo(toCanvasX(X_MAX), toCanvasY(0)); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(toCanvasX(0), toCanvasY(Y_MIN)); ctx.lineTo(toCanvasX(0), toCanvasY(Y_MAX)); ctx.stroke();

            // Line y = 4x (Guide)
            ctx.setLineDash([6, 4]);
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(toCanvasX(X_MIN), toCanvasY(line(X_MIN)));
            ctx.lineTo(toCanvasX(X_MAX), toCanvasY(line(X_MAX)));
            ctx.stroke();

            // f(x) (Guide)
            ctx.setLineDash([4, 4]);
            ctx.strokeStyle = '#fca5a5';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            for (let x = X_MIN; x <= X_MAX; x += 0.2) {
                const cx = toCanvasX(x), cy = toCanvasY(f(x));
                if (x === X_MIN) ctx.moveTo(cx, cy); else ctx.lineTo(cx, cy);
            }
            ctx.stroke();
            ctx.setLineDash([]);

            // g(x) = min(f, line) (Main)
            ctx.strokeStyle = '#10b981';
            ctx.lineWidth = 6;
            ctx.lineJoin = 'round';
            ctx.beginPath();
            for (let x = X_MIN; x <= X_MAX; x += 0.1) {
                const cx = toCanvasX(x), cy = toCanvasY(g(x));
                if (x === X_MIN) ctx.moveTo(cx, cy); else ctx.lineTo(cx, cy);
            }
            ctx.stroke();

            // y = t
            ctx.strokeStyle = '#f59e0b';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(toCanvasX(X_MIN), toCanvasY(t));
            ctx.lineTo(toCanvasX(X_MAX), toCanvasY(t));
            ctx.stroke();

            // Intersections
            const intersects = getIntersections();
            intersects.forEach(ix => {
                ctx.fillStyle = '#f59e0b';
                ctx.shadowBlur = 10; ctx.shadowColor = 'rgba(245, 158, 11, 0.5)';
                ctx.beginPath(); ctx.arc(toCanvasX(ix), toCanvasY(t), 8, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'white'; ctx.lineWidth = 2; ctx.stroke();
            });

            // Vertex
            ctx.fillStyle = '#ef4444';
            ctx.beginPath(); ctx.arc(toCanvasX(p), toCanvasY(q), 14, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = 'white'; ctx.lineWidth = 4; ctx.stroke();

            updateUI();
        }

        function resize() {
            // Force redraw with new dimensions
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            draw();
        }

        function getCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function onStart(e) {
            const {x, y} = getCoords(e);
            const distVertex = Math.sqrt(Math.pow(toCanvasX(p) - x, 2) + Math.pow(toCanvasY(q) - y, 2));
            if (distVertex < 45) dragTarget = 'vertex';
            else if (Math.abs(y - toCanvasY(t)) < 25) dragTarget = 'lineT';
            
            if (dragTarget && e.type === 'touchstart') e.preventDefault();
        }

        function onMove(e) {
            if (!dragTarget) return;
            const {x, y} = getCoords(e);
            if (dragTarget === 'vertex') { p = fromCanvasX(x); q = fromCanvasY(y); }
            else if (dragTarget === 'lineT') { t = fromCanvasY(y); }
            draw();
            if (e.type === 'touchmove') e.preventDefault();
        }

        function onEnd() { dragTarget = null; }

        canvas.addEventListener('mousedown', onStart);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);
        
        canvas.addEventListener('touchstart', onStart, {passive: false});
        canvas.addEventListener('touchmove', onMove, {passive: false});
        canvas.addEventListener('touchend', onEnd);

        document.getElementById('btnConvUp').onclick = () => { a = 1; draw(); };
        document.getElementById('btnConvDown').onclick = () => { a = -1; draw(); };

        window.addEventListener('resize', resize);
        window.onload = resize;
    </script>
</body>
</html>
