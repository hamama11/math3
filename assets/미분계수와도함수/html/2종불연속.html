<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>f'(x) vs lim f'(x)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Fira+Code:wght@400;500&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #0d1117; color: #c9d1d9; }
        .code-font { font-family: 'Fira Code', monospace; }
        .text-large { font-size: 26px !important; line-height: 1.6 !important; }
        .text-xlarge { font-size: 36px !important; line-height: 1.4 !important; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [targetX, setTargetX] = useState(0.28);
            const [zoom, setZoom] = useState(1);
            const [isAnimating, setIsAnimating] = useState(false);
            const [animStatus, setAnimStatus] = useState("");
            const canvasRef = useRef(null);
            const animationRef = useRef(null);
            const synthRef = useRef(null);

            const f = (x) => (x === 0 ? 0 : x * x * Math.sin(1 / x));
            const df = (x) => (x === 0 ? 0 : 2 * x * Math.sin(1 / x) - Math.cos(1 / x));

            const runZoomInOdyssey = async () => {
                if (isAnimating) {
                    cancelAnimationFrame(animationRef.current);
                    if (synthRef.current) synthRef.current.dispose();
                    setIsAnimating(false);
                    setAnimStatus("");
                    return;
                }

                await Tone.start();
                synthRef.current = new Tone.Oscillator({ type: 'sawtooth', volume: -15 }).toDestination().start();
                
                setIsAnimating(true);
                const startX = 0.28;
                let frame = 0;
                const totalFrames = 800; 

                const animate = () => {
                    frame++;
                    const progress = frame / totalFrames;
                    let currentX, currentZoom;

                    if (progress < 0.2) {
                        const p = progress / 0.2;
                        currentX = startX - (startX - 0.04) * Math.sin((p * Math.PI) / 2);
                        currentZoom = 1.0 + 1.5 * Math.sin((p * Math.PI) / 2);
                        setAnimStatus("🚀 1단계: 접근 중 (기울기 요동 관찰)");
                    } else if (progress < 0.85) {
                        const p = (progress - 0.2) / 0.65;
                        currentX = 0.04 - (0.04 - 0.002) * (p * p);
                        currentZoom = 2.5 + (17.5 * (p * p));
                        setAnimStatus("🔍 2단계: 미시세계 줌인! (무한 진동 관찰 중)");
                    } else {
                        currentX = 0.002 * (1 - (progress - 0.85) / 0.15);
                        currentZoom = 20.0;
                        setAnimStatus("🧊 3단계: 특이점(x=0) 착륙! 완벽한 평온");
                    }

                    setTargetX(currentX);
                    setZoom(currentZoom);

                    // Audio
                    const freq = 100 + Math.abs(df(currentX) * 200);
                    synthRef.current.frequency.rampTo(freq, 0.1);

                    if (frame < totalFrames) animationRef.current = requestAnimationFrame(animate);
                    else { 
                        setTargetX(0); setZoom(20); setIsAnimating(false); 
                        if (synthRef.current) synthRef.current.dispose();
                        setTimeout(() => setAnimStatus(""), 2000); 
                    }
                };
                animationRef.current = requestAnimationFrame(animate);
            };

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const dpr = window.devicePixelRatio || 1;
                const rect = canvas.getBoundingClientRect();
                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;
                ctx.scale(dpr, dpr);
                const width = rect.width, height = rect.height;
                ctx.clearRect(0, 0, width, height);

                const xMax = 0.5 / zoom, xMin = -0.5 / zoom, yMax = 0.25 / zoom, yMin = -0.25 / zoom;
                const toScreenX = (x) => ((x - xMin) / (xMax - xMin)) * width;
                const toScreenY = (y) => height - ((y - yMin) / (yMax - yMin)) * height;

                ctx.strokeStyle = '#21262d'; ctx.beginPath(); ctx.moveTo(0, toScreenY(0)); ctx.lineTo(width, toScreenY(0)); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(toScreenX(0), 0); ctx.lineTo(toScreenX(0), height); ctx.stroke();

                ctx.strokeStyle = '#58a6ff'; ctx.lineWidth = 3;
                ctx.beginPath();
                const steps = 1500;
                for (let i = 0; i <= steps; i++) {
                    const rx = xMin + (i / steps) * (xMax - xMin);
                    const sx = toScreenX(rx), sy = toScreenY(f(rx));
                    if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
                }
                ctx.stroke();

                const tx = targetX, ty = f(tx), slope = df(tx);
                ctx.fillStyle = '#ff7b72'; ctx.beginPath(); ctx.arc(toScreenX(tx), toScreenY(ty), 6, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#ff7b72'; ctx.lineWidth = 2;
                ctx.beginPath();
                const tl = 0.15 / zoom;
                ctx.moveTo(toScreenX(tx - tl), toScreenY(slope * (-tl) + ty));
                ctx.lineTo(toScreenX(tx + tl), toScreenY(slope * (tl) + ty));
                ctx.stroke();
            }, [targetX, zoom]);

            return (
                <div className="min-h-screen bg-[#0d1117] p-4 lg:p-12">
                    <header className="max-w-7xl mx-auto mb-10 border-b border-[#30363d] pb-6">
                        <h1 className="text-xlarge font-extrabold text-[#f0f6fc]">f'(x) vs lim f'(x)</h1>
                    </header>

                    <main className="max-w-7xl mx-auto space-y-12">
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                            <div className="lg:col-span-8 bg-[#161b22] border border-[#30363d] rounded-2xl p-6">
                                <canvas ref={canvasRef} className="w-full aspect-[16/9] bg-[#0d1117] rounded-xl border border-[#21262d]" />
                                {animStatus && <div className="mt-4 p-4 bg-[#f0883e]/10 border border-[#f0883e] rounded text-large font-bold text-[#f0883e] animate-pulse">{animStatus}</div>}
                            </div>
                            <div className="lg:col-span-4 bg-[#161b22] border border-[#30363d] rounded-2xl p-8 space-y-8">
                                <button onClick={runZoomInOdyssey} className="w-full py-6 bg-[#1f6feb] hover:bg-[#388bfd] text-white font-bold rounded-lg text-large transition-all">
                                    {isAnimating ? "시뮬레이션 정지" : "블랙홀 오디세이 가동"}
                                </button>
                                <div className="space-y-4">
                                    <label className="text-large text-[#8b949e]">실시간 탐색 지점 (x)</label>
                                    <input type="range" min="-0.3" max="0.3" step="0.001" value={targetX} onChange={(e) => setTargetX(parseFloat(e.target.value))} className="w-full h-4 accent-[#ff7b72]" />
                                </div>
                                <div className="space-y-4">
                                    <label className="text-large text-[#8b949e]">현미경 확대 비율 (Zoom)</label>
                                    <input type="range" min="1" max="20" step="0.1" value={zoom} onChange={(e) => setZoom(parseFloat(e.target.value))} className="w-full h-4 accent-[#58a6ff]" />
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
