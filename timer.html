<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>타이머</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: transparent;
      color: white;
    }

    .wrap {
      padding: 12px;
      border-radius: 12px;
      background: #222;
      text-align: center;
    }

    .title {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .time {
      font-size: 40px;
      font-weight: bold;
      margin: 12px 0;
    }

    .controls, .adjust {
      display: flex;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
      margin: 8px 0;
    }

    button {
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .small {
      font-size: 13px;
      padding: 6px 10px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="title">⏱ 타이머</div>

    <div class="adjust">
      <button class="small" onclick="adjustTime(-60)">-1분</button>
      <button class="small" onclick="adjustTime(60)">+1분</button>
    </div>

    <div class="time" id="display">05:00</div>

    <div class="controls">
      <button onclick="startTimer()">시작</button>
      <button onclick="pauseTimer()">일시정지</button>
      <button onclick="resetTimer()">리셋</button>
    </div>
  </div>

  <script>
    let initialSeconds = 300;   // 기본 5분
    let totalSeconds = initialSeconds;
    let timer = null;

    function formatTime(seconds) {
      const sign = seconds < 0 ? "-" : "";
      const abs = Math.abs(seconds);
      const m = String(Math.floor(abs / 60)).padStart(2, "0");
      const s = String(abs % 60).padStart(2, "0");
      return `${sign}${m}:${s}`;
    }

    function updateDisplay() {
      document.getElementById("display").textContent = formatTime(totalSeconds);
    }

    function startTimer() {
      if (timer !== null) return;

      timer = setInterval(() => {
        totalSeconds--;
        updateDisplay();
      }, 1000);
    }

    function pauseTimer() {
      clearInterval(timer);
      timer = null;
    }

    function resetTimer() {
      clearInterval(timer);
      timer = null;
      totalSeconds = initialSeconds;
      updateDisplay();
    }

    function adjustTime(delta) {
      totalSeconds += delta;
      initialSeconds += delta;

      if (initialSeconds < 0) initialSeconds = 0;
      if (totalSeconds < -359999) totalSeconds = -359999;

      updateDisplay();
    }

    updateDisplay();
  </script>
</body>
</html>
